name: Notify ubo-filters

on:
  push:
    branches:
      - main
    paths:
      - 'AdmiraList.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ubo-filters admiral-domains workflow
        env:
          TOKEN: ${{ secrets.UBO_FILTERS_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/LanikSJ/ubo-filters/dispatches \
            -d '{"event_type":"admiral-list-updated"}'
